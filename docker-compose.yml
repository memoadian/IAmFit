services:
    iamfit-app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP:-1000}"
                WWWUSER: "${WWWUSER:-1000}"
        image: laravel-12/iamfit
        container_name: iamfit-app
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "${APP_PORT:-8001}:80"
        environment:
            WWWUSER: "${WWWUSER:-1000}"
        volumes:
            - ".:/var/www/html"
        networks:
            - iamfit
        depends_on:
            pgsql:
                condition: service_healthy

    pgsql:
        image: "postgres:17"
        container_name: iamfit-pgsql
        ports:
            - "${FORWARD_DB_PORT:-5433}:5432"
        environment:
            POSTGRES_DB: "${DB_DATABASE:-iamfit}"
            POSTGRES_USER: "${DB_USERNAME:-iamfit}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
        volumes:
            - "iamfit-pgsql:/var/lib/postgresql/data"
        networks:
            - iamfit
        healthcheck:
            test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-iamfit}", "-U", "${DB_USERNAME:-iamfit}"]
            interval: 5s
            timeout: 5s
            retries: 10

    adminer:
        image: adminer:latest
        container_name: iamfit-adminer
        ports:
            - "${ADMINER_PORT:-8084}:8080"
        environment:
            ADMINER_DEFAULT_SERVER: pgsql
        depends_on:
            - pgsql
        networks:
            - iamfit

networks:
    iamfit:
        driver: bridge

volumes:
    iamfit-pgsql:
        driver: local
